<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>항공 필기 랜덤 문제풀이</title>
<style>
:root{--blue:#1757a5;--ink:#1b293a;--line:#dce5ee;--bg:#f3f7fb;--good:#137a49;--bad:#b93838}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink)}
.container{width:min(940px,calc(100% - 28px));margin:26px auto 50px;background:white;padding:clamp(16px,4vw,34px);border-radius:18px;box-shadow:0 10px 32px #1a385211}
h1{font-size:clamp(24px,4vw,32px);margin:0;color:#124c90}.subtitle{color:#64748b;margin:8px 0 24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab,.btn{border:1px solid var(--line);background:white;border-radius:10px;padding:11px 15px;font:inherit;cursor:pointer;color:var(--ink)}.tab.active,.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.danger{color:var(--bad)}
.hidden{display:none!important}.subject-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.subject{padding:20px;text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;min-height:105px}.subject:hover,.choice:hover:not(:disabled){border-color:var(--blue);background:#f0f6ff}.subject strong{display:block;font-size:18px}.subject small{display:block;color:#64748b;margin-top:8px}.status{margin:12px 0 20px;color:#53657d}.question{font-size:20px;line-height:1.65;white-space:pre-wrap;margin:25px 0}.progress{font-size:14px;color:#64748b}.choices{display:grid;gap:11px}.choice{border:2px solid var(--line);background:white;padding:15px;text-align:left;border-radius:11px;cursor:pointer;font:inherit;line-height:1.5;white-space:pre-wrap}.choice.correct{border-color:#3ba56f;background:#e6f7ed}.choice.wrong{border-color:#e27b7b;background:#ffeded}.explanation{margin-top:18px;padding:17px;border-radius:11px;background:#eef5fd;line-height:1.65;white-space:pre-wrap}.explanation strong{display:block;margin-bottom:6px}.navigation{display:flex;flex-wrap:wrap;gap:9px;margin-top:23px}.summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 20px}.pill{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}
.calendar-bar{display:flex;justify-content:center;align-items:center;gap:14px;margin:15px 0}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:#64748b;font-size:13px;padding:9px 0}.day{min-height:70px;border:1px solid var(--line);background:white;border-radius:9px;text-align:left;padding:7px;cursor:pointer;font:inherit}.day.today{border:2px solid var(--blue)}.day.selected{background:#eaf2ff}.day.empty{border:0;cursor:default}.day span{display:block;font-size:12px;color:#436585;margin-top:7px}.detail{margin-top:20px;padding-top:15px;border-top:1px solid var(--line)}.wrong-item{padding:13px 0;border-bottom:1px solid var(--line);line-height:1.55}.wrong-item small{color:#64748b;display:block;margin-top:5px}.notice{color:#6d7a89;font-size:13px;line-height:1.6;margin-top:17px}.error{color:var(--bad);white-space:pre-wrap}footer{text-align:center;color:#8894a4;font-size:12px;margin-top:32px}
@media(max-width:500px){.day{min-height:62px;padding:4px;font-size:12px}.day span{font-size:10px}.container{margin:12px auto}.question{font-size:18px}}
</style>
</head>
<body>
<main class="container">
 <div class="top"><div><h1>항공 필기 랜덤 문제풀이</h1><p class="subtitle">과목별 학습 · 오답 복습 · 학습 캘린더</p></div><button class="btn" id="home-btn">과목 선택</button></div>
 <div class="tabs"><button class="tab active" id="tab-subjects">과목 선택</button><button class="tab" id="tab-calendar">학습 캘린더</button></div>
 <section id="subjects-view"><h2>학습할 과목을 선택하세요</h2><div id="subjects" class="subject-grid"></div><p id="load-note" class="status"></p><p class="notice">JSON 6개 파일을 index.html과 같은 폴더에 올려주세요. 파일명의 대소문자와 공백을 그대로 유지해야 합니다.</p></section>
 <section id="quiz-view" class="hidden"><div class="top"><h2 id="quiz-title"></h2><span id="mode-label" class="pill"></span></div><div class="summary"><span id="counter" class="pill"></span><span id="session-score" class="pill"></span></div><div id="question" class="question"></div><div id="choices" class="choices"></div><div id="explanation" class="explanation hidden"></div><div class="navigation"><button class="btn" id="prev">이전</button><button class="btn primary" id="next">다음 문제</button><button class="btn" id="retry">이 과목 오답 복습</button><button class="btn" id="normal">새 랜덤 문제</button></div><p id="quiz-error" class="error"></p></section>
 <section id="calendar-view" class="hidden"><h2>학습 캘린더</h2><p class="status">날짜를 클릭하면 풀이 횟수와 틀린 문제를 확인할 수 있습니다.</p><div class="calendar-bar"><button class="btn" id="month-prev" aria-label="이전 달">◀</button><strong id="month-label"></strong><button class="btn" id="month-next" aria-label="다음 달">▶</button></div><div class="calendar" id="calendar"></div><div class="detail"><h3 id="day-title"></h3><div id="day-summary" class="summary"></div><div id="day-wrongs"></div></div><div class="navigation"><button class="btn" id="export">학습 기록 백업(JSON)</button><label class="btn" for="import-file" style="cursor:pointer">백업 복원</label><input type="file" id="import-file" accept="application/json,.json" class="hidden"></div><p class="notice">기록은 현재 브라우저의 localStorage에 저장됩니다. 다른 기기나 브라우저와 자동 동기화되지 않으며 브라우저 데이터 삭제 시 사라질 수 있습니다. 주기적으로 백업하세요.</p></section>
 <footer>© 2026 Aviation Training</footer>
</main>
<script>
'use strict';
// 업로드한 6개 JSON 파일명과 일치하도록 설정했습니다. 대소문자와 공백을 유지하세요.
const SUBJECTS = [
 {id:'atp',name:'ATP',files:['ATP.json']},
 {id:'aerodynamics',name:'비행이론',files:['Aerodynamic theory.json']},
 {id:'aim',name:'AIM',files:['AIM.json']},
 {id:'navigation',name:'공중항법',files:['Navigation.json']},
 {id:'weather',name:'항공기상',files:['Weather.json']},
 {id:'law',name:'항공법규',files:['Law.json']}
];
const STORAGE_KEY='aviationQuiz_v2';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function safeStoreRead(){try{const v=JSON.parse(localStorage.getItem(STORAGE_KEY));return v&&typeof v==='object'&&Array.isArray(v.attempts)&&Array.isArray(v.wrongIds)?v:{attempts:[],wrongIds:[]}}catch{return {attempts:[],wrongIds:[]}}}
let store=safeStoreRead();
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(store))}catch(e){alert('저장 공간이 부족하거나 비활성화되었습니다. 기록이 저장되지 않을 수 있습니다.')}}
let banks={}, subject=null,queue=[],index=0,retryMode=false,answered={},sessionRight=0,sessionTotal=0;
let viewedMonth=new Date();viewedMonth.setDate(1);let chosenDay=today();
const text=v=>v==null?'':String(v).trim();
const shuffle=a=>{const b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function cleanProblem(p,subjectId,i){
 if(!p||typeof p!=='object')return null;
 const q=text(p.question??p.문제??p.question_text??p.q);
 const imageHints=/(<img\b|!\[[^\]]*\]\(|\b(?:figure|fig\.|그림|도표|사진|이미지)\s*(?:\d+|을|를|에|의|참조|보))/i;
 if(!q||imageHints.test(q)||p.image||p.image_url||p.has_image||p.이미지)return null;
 let raw=p.choices??p.options??p.보기??{};
 let options={};
 if(Array.isArray(raw))raw.forEach((x,j)=>{if(j<6)options[String.fromCharCode(65+j)]=text(x)});
 else if(raw&&typeof raw==='object')Object.entries(raw).forEach(([k,v])=>{let key=text(k).toUpperCase().replace(/[.\s]/g,'');if(/^[A-F]$/.test(key))options[key]=text(v)});
 if(!Object.keys(options).length){for(const k of ['A','B','C','D','E'])if(p[k]!=null)options[k]=text(p[k])}
 if(Object.keys(options).length<2||Object.values(options).some(v=>!v||/^(?:nan|null|none|undefined)$/i.test(v)||imageHints.test(v)))return null;
 let ans=text(p.answer??p.correct_answer??p.correct??p.정답).toUpperCase().replace(/^[①②③④⑤]$/,s=>String.fromCharCode(65+'①②③④⑤'.indexOf(s)));
 ans=ans.replace(/^[\s]*([A-F])[.\s).].*$/,'$1');
 if(/^\d+$/.test(ans)){const n=Number(ans);ans=Object.keys(options)[n>=1&&n<=Object.keys(options).length?n-1:n]??ans}
 if(!options[ans]){const found=Object.keys(options).find(k=>options[k].toUpperCase()===ans);if(found)ans=found}
 if(!options[ans])return null;
 const ex=p.explanation??p.discussion??p.해설??'';
 const detail=typeof ex==='object'&&ex!==null?[ex.en&&`[EN] ${text(ex.en)}`,ex.kr&&`[KR] ${text(ex.kr)}`,ex.ko&&`[KR] ${text(ex.ko)}`].filter(Boolean).join('\n\n'):text(ex);
 return {id:`${subjectId}:${text(p.id??p.question_id??p.번호)||i}`,subject:subjectId,question:q,choices:options,answer:ans,explanation:detail};
}
async function loadBank(s){
 if(banks[s.id])return banks[s.id];let lastError='';
 for(const file of s.files){try{const res=await fetch(encodeURI(file),{cache:'no-cache'});if(!res.ok)throw Error(`HTTP ${res.status}`);const json=await res.json();const entries=Array.isArray(json)?json:json.problems??json.questions??json.data??json.items;
 if(!Array.isArray(entries))throw Error('JSON 배열을 찾지 못했습니다');
 const filtered=entries.map((p,i)=>cleanProblem(p,s.id,i)).filter(Boolean);
 if(!filtered.length)throw Error('표시할 수 있는 문제 없음 (JSON 형식/정답 확인 필요)');
 banks[s.id]=filtered;return filtered;
 }catch(e){lastError=`${file}: ${e.message}`}}
 throw Error(lastError||'파일을 찾을 수 없습니다');
}
function showView(which){for(const name of ['subjects','quiz','calendar'])$(name+'-view').classList.toggle('hidden',name!==which);$('tab-subjects').classList.toggle('active',which!=='calendar');$('tab-calendar').classList.toggle('active',which==='calendar');if(which==='calendar')renderCalendar()}
function subjectCards(){const box=$('subjects');box.replaceChildren();SUBJECTS.forEach(s=>{const b=document.createElement('button');b.className='subject';const label=document.createElement('strong');label.textContent=s.name;const small=document.createElement('small');small.textContent=banks[s.id]?`${banks[s.id].length}문제 준비됨`:'선택하면 문제 불러오기';b.append(label,small);b.onclick=()=>startSubject(s);box.appendChild(b)})}
async function startSubject(s){$('load-note').textContent=`${s.name} 문제를 불러오는 중...`;try{const list=await loadBank(s);subject=s;retryMode=false;queue=shuffle(list);index=0;answered={};sessionRight=0;sessionTotal=0;showView('quiz');renderQuestion();$('load-note').textContent='';subjectCards()}catch(e){$('load-note').textContent=`불러오기 실패: ${e.message}`;subjectCards()}}
function renderQuestion(){if(!queue.length){$('question').textContent='풀 문제가 없습니다.';$('choices').replaceChildren();$('explanation').classList.add('hidden');$('counter').textContent='0 / 0';return}
 index=Math.max(0,Math.min(index,queue.length-1));const p=queue[index];$('quiz-title').textContent=subject.name;$('mode-label').textContent=retryMode?'오답 복습':'무작위 문제';$('counter').textContent=`${index+1} / ${queue.length}`;$('session-score').textContent=`이번 학습: ${sessionTotal}문제 · 정답 ${sessionRight}개`;$('question').textContent=p.question;$('quiz-error').textContent='';
 const box=$('choices');box.replaceChildren();const choiceKeys=Object.keys(p.choices).sort();const selected=answered[p.id];for(const key of choiceKeys){const btn=document.createElement('button');btn.className='choice';btn.textContent=`${key}. ${p.choices[key]}`;if(selected){btn.disabled=true;if(key===p.answer)btn.classList.add('correct');else if(key===selected)btn.classList.add('wrong')}else btn.onclick=()=>answer(key);box.append(btn)}
 $('explanation').classList.toggle('hidden',!selected);$('explanation').textContent=selected?`${selected===p.answer?'정답입니다.':'오답입니다.'} 정답: ${p.answer} (${p.choices[p.answer]})${p.explanation?'\n\n'+p.explanation:''}`:'';
 $('prev').disabled=index===0;$('next').textContent=index===queue.length-1?'처음부터 새 문제':'다음 문제';
}
function answer(choice){const p=queue[index];if(!p||answered[p.id])return;answered[p.id]=choice;const right=choice===p.answer;sessionTotal++;if(right)sessionRight++;
 store.attempts.push({date:today(),time:new Date().toISOString(),subject:p.subject,id:p.id,question:p.question,selected:choice,correctAnswer:p.answer,selectedText:p.choices[choice],correctText:p.choices[p.answer],correct:right});
 if(!right){if(!store.wrongIds.includes(p.id))store.wrongIds.push(p.id)}else if(retryMode){store.wrongIds=store.wrongIds.filter(id=>id!==p.id)}save();renderQuestion()}
function startRetry(){const wrong=queueForWrong();if(!wrong.length){alert('이 과목에서 복습할 오답이 없습니다.');return}retryMode=true;queue=shuffle(wrong);index=0;answered={};sessionTotal=0;sessionRight=0;renderQuestion()}
function queueForWrong(){return (banks[subject.id]||[]).filter(p=>store.wrongIds.includes(p.id))}
function newSet(){retryMode=false;queue=shuffle(banks[subject.id]);index=0;answered={};sessionRight=0;sessionTotal=0;renderQuestion()}
function next(){if(index<queue.length-1){index++;renderQuestion()}else if(confirm('마지막 문제입니다. 새로운 무작위 문제 순서로 다시 시작할까요?'))newSet()}
function element(tag,cls,content){const el=document.createElement(tag);if(cls)el.className=cls;if(content!==undefined)el.textContent=content;return el}
function renderCalendar(){const yr=viewedMonth.getFullYear(),mo=viewedMonth.getMonth();$('month-label').textContent=`${yr}년 ${mo+1}월`;const grid=$('calendar');grid.replaceChildren();['일','월','화','수','목','금','토'].forEach(n=>grid.append(element('div','weekday',n)));
 for(let i=0;i<new Date(yr,mo,1).getDay();i++)grid.append(element('div','day empty',''));
 const days=new Date(yr,mo+1,0).getDate();for(let d=1;d<=days;d++){const key=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const records=store.attempts.filter(a=>a.date===key);const b=element('button','day');if(key===today())b.classList.add('today');if(key===chosenDay)b.classList.add('selected');b.append(element('strong','',String(d)));if(records.length)b.append(element('span','',`${records.length}문제 / 오답 ${records.filter(a=>!a.correct).length}`));b.onclick=()=>{chosenDay=key;renderCalendar()};grid.append(b)}renderDay()}
function renderDay(){const rows=store.attempts.filter(a=>a.date===chosenDay);const misses=rows.filter(a=>!a.correct);$('day-title').textContent=`${chosenDay} 학습 기록`;const summary=$('day-summary');summary.replaceChildren();for(const v of [`풀이 ${rows.length}회`,`정답 ${rows.length-misses.length}회`,`오답 ${misses.length}회`])summary.append(element('span','pill',v));const box=$('day-wrongs');box.replaceChildren();if(!misses.length){box.append(element('p','status','이 날짜에 기록된 오답이 없습니다.'));return}
 box.append(element('h4','','이날 틀린 문제'));for(const a of misses){const name=SUBJECTS.find(s=>s.id===a.subject)?.name??a.subject;const item=element('div','wrong-item');item.append(element('strong','',`${name} | ${a.question}`));item.append(element('small','',`선택: ${a.selected}${a.selectedText?' ('+a.selectedText+')':''} / 정답: ${a.correctAnswer}${a.correctText?' ('+a.correctText+')':''}`));box.append(item)}}
function exportData(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),...store},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`aviation-study-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
async function importData(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.attempts)||!Array.isArray(data.wrongIds))throw Error('백업 형식이 다릅니다');if(!confirm('현재 기록을 백업 파일의 기록으로 교체할까요?'))return;store={attempts:data.attempts.filter(a=>a&&typeof a.date==='string'&&typeof a.question==='string'&&typeof a.correct==='boolean'),wrongIds:data.wrongIds.filter(id=>typeof id==='string')};save();renderCalendar();alert('복원했습니다.')}catch(e){alert(`복원 실패: ${e.message}`)}finally{$('import-file').value=''}}
$('home-btn').onclick=()=>{subjectCards();showView('subjects')};$('tab-subjects').onclick=()=>{subjectCards();showView('subjects')};$('tab-calendar').onclick=()=>showView('calendar');$('prev').onclick=()=>{if(index>0){index--;renderQuestion()}};$('next').onclick=next;$('retry').onclick=startRetry;$('normal').onclick=newSet;
$('month-prev').onclick=()=>{viewedMonth.setMonth(viewedMonth.getMonth()-1);renderCalendar()};$('month-next').onclick=()=>{viewedMonth.setMonth(viewedMonth.getMonth()+1);renderCalendar()};$('export').onclick=exportData;$('import-file').onchange=e=>importData(e.target.files?.[0]);subjectCards();
</script>
</body>
</html>
